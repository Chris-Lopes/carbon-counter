<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carbon Counter</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Navbar */
    .navbar {
      width: 100%;
      height: 7%;
      background-color: #454141;
      color: white;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
    }

    .navbar h1 {
      font-size: 24px;
      margin: 0;
      padding-left: 20px;
    }

    .navbar .score-box {
      width: 60px;
      height: 60px;
      background-color: #ff6347;
      color: white;
      font-weight: bold;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      margin-right: 20px;
    }

    /* Main container */
    .container {
      margin-top: 80px; /* Spacing for the fixed navbar */
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      width: 100%;
      box-sizing: border-box;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 30px;
    }

    /* Search and filter section */
    .search-filter {
      width: 100%;
      max-width: 800px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
    }

    .search-bar {
      width: 30%;
      padding: 10px;
      font-size: 16px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .filter-select {
      padding: 10px;
      font-size: 16px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    /* Big container for all the cards */
    .coupon-box-container {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      animation: slideIn 1s ease-out forwards; /* Animation */
      opacity: 0;
    }

    /* Animation for sliding in */
    @keyframes slideIn {
      0% {
        transform: translateY(50px);
        opacity: 0;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    /* Coupon cards */
    .card {
      background-color: #ffffff;
      padding: 20px;
      margin-bottom: 20px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 10px;
      box-sizing: border-box;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .card-content {
      flex: 1;
      min-width: 0; /* Fix flexbox shrinking */
    }

    .card h2 {
      font-size: 22px;
      margin-bottom: 10px;
      word-wrap: break-word; /* Avoid overflowing of text */
    }

    .card p {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .card button {
      padding: 12px 25px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    .card button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    .card img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
      margin-left: 20px;
    }

  </style>
</head>
<body>

  <!-- Navbar with Carbon Counter and score -->
  <div class="navbar">
    <h1>Carbon Counter</h1>
    <div class="score-box" id="score">
      100
    </div>
  </div>

  <!-- Main container -->
  <div class="container">
    <h1>Coupons Store</h1>

    <!-- Search and filter bar -->
    <div class="search-filter">
      <input type="text" id="searchBar" class="search-bar" onkeyup="searchCoupons()" placeholder="Search for coupons...">
      <select id="filterSelect" class="filter-select" onchange="sortCoupons()">
        <option value="none">Sort by</option>
        <option value="lowToHighDiscount">Discount: Low to High</option>
        <option value="highToLowDiscount">Discount: High to Low</option>
        <option value="lowToHighPoints">Points: Low to High</option>
        <option value="highToLowPoints">Points: High to Low</option>
      </select>
    </div>

    <!-- Big container for all coupon cards -->
    <div class="coupon-box-container" id="couponContainer">
      <!-- Coupon Card 1 -->
      <div class="card" data-discount="20" data-points="30">
        <div class="card-content">
          <h2>Company A - 20% Off</h2>
          <p>Coupon Price: 30 points</p>
          <button onclick="buyCoupon(30, this)">Redeem Now</button>
        </div>
        <img src="https://via.placeholder.com/100" alt="Company A Coupon Image">
      </div>

      <!-- Coupon Card 2 -->
      <div class="card" data-discount="15" data-points="50">
        <div class="card-content">
          <h2>Company B - 15% Off</h2>
          <p>Coupon Price: 50 points</p>
          <button onclick="buyCoupon(50, this)">Redeem Now</button>
        </div>
        <img src="https://via.placeholder.com/100" alt="Company B Coupon Image">
      </div>

      <!-- Coupon Card 3 -->
      <div class="card" data-discount="10" data-points="70">
        <div class="card-content">
          <h2>Company C - 10% Off</h2>
          <p>Coupon Price: 70 points</p>
          <button onclick="buyCoupon(70, this)">Redeem Now</button>
        </div>
        <img src="https://via.placeholder.com/100" alt="Company C Coupon Image">
      </div>

      <!-- Coupon Card 4 -->
      <div class="card" data-discount="25" data-points="40">
        <div class="card-content">
          <h2>Company D - 25% Off</h2>
          <p>Coupon Price: 40 points</p>
          <button onclick="buyCoupon(40, this)">Redeem Now</button>
        </div>
        <img src="https://via.placeholder.com/100" alt="Company D Coupon Image">
      </div>

      <!-- Coupon Card 5 -->
      <div class="card" data-discount="5" data-points="20">
        <div class="card-content">
          <h2>Company E - 5% Off</h2>
          <p>Coupon Price: 20 points</p>
          <button onclick="buyCoupon(20, this)">Redeem Now</button>
        </div>
        <img src="https://via.placeholder.com/100" alt="Company E Coupon Image">
      </div>
    </div>
  </div>

  <script>
    let score = 100; // Initial score

    function buyCoupon(cost, button) {
      if (score >= cost) {
        score -= cost;
        document.getElementById('score').textContent = score;
        button.disabled = true; // Disable the button once bought
        button.textContent = "Coupon Bought";
      } else {
        alert("Not enough points to buy this coupon.");
      }
    }

    // Search function for coupon cards
    function searchCoupons() {
      const searchInput = document.getElementById('searchBar').value.toLowerCase();
      const cards = document.querySelectorAll('.card');

      cards.forEach(card => {
        const title = card.querySelector('h2').textContent.toLowerCase();
        if (title.includes(searchInput)) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    }

    // Sort function for coupons
    function sortCoupons() {
      const filterValue = document.getElementById('filterSelect').value;
      const container = document.getElementById('couponContainer');
      const cards = Array.from(container.getElementsByClassName('card'));

      if (filterValue === 'lowToHighDiscount') {
        cards.sort((a, b) => a.getAttribute('data-discount') - b.getAttribute('data-discount'));
      } else if (filterValue === 'highToLowDiscount') {
        cards.sort((a, b) => b.getAttribute('data-discount') - a.getAttribute('data-discount'));
      } else if (filterValue === 'lowToHighPoints') {
        cards.sort((a, b) => a.getAttribute('data-points') - b.getAttribute('data-points'));
      } else if (filterValue === 'highToLowPoints') {
        cards.sort((a, b) => b.getAttribute('data-points') - a.getAttribute('data-points'));
      }

      cards.forEach(card => container.appendChild(card)); // Re-attach sorted cards
    }
  </script>
</body>
</html>
