<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Form</title>
    <script src="https://www.gstatic.com/firebasejs/9.16.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.16.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.16.0/firebase-firestore.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-custom {
            background-image: url('/src/images/bg.jpg');
        }
        .bg-form-custom {
            background-image: url('/src/images/login1.jpg');
        }
    </style>
</head>
<body class="bg-custom bg-cover bg-center bg-no-repeat bg-gray-100 h-screen w-full flex items-center justify-center">
    <div class="relative w-full max-w-md">
        <div class="bg-form-custom bg-cover bg-center bg-no-repeat rounded-lg overflow-hidden shadow-lg">
            <div class="absolute inset-0 bg-black opacity-50 rounded-lg"></div>
            <div class="relative z-10 p-8">
                <form class="w-full max-w-sm mx-auto" id="login-form">
                    <div class="mb-6 text-center">
                        <span class="text-2xl font-bold text-white">LogIn</span>
                    </div>

                    <h5 class="text-xl font-normal mb-6 text-center text-white">
                        Sign into your account
                    </h5>

                    <div class="mb-4">
                        <label for="email" class="block text-sm font-medium text-white">Email address</label>
                        <input type="email" id="email" class="mt-1 block w-full rounded-md border-gray-800 bg-gray-200 p-2 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50" required>
                    </div>

                    <div class="mb-6">
                        <label for="password" class="block text-sm font-medium text-white">Password</label>
                        <input type="password" id="password" class="mt-1 block w-full rounded-md border-gray-800 bg-gray-200 p-2 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50" required>
                    </div>

                    <div class="mb-6">
                        <a href= "landing.html" ><button type="button" onclick="login()" class="w-full py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                            Login
                        </button></a>
                    </div>

                    <div class="text-sm text-center">
                        <a href="#" class="text-indigo-300 hover:text-indigo-200">Forgot password?</a>
                    </div>
                    <div class="mt-4 text-sm text-center">
                        <span class="text-gray-300">Don't have an account?</span>
                        <a href="signup.html" class="text-indigo-300 hover:text-indigo-200"> Register here</a>
                    </div>
                    <div class="mt-6 text-xs text-center text-gray-300">
                        <a href="#" class="hover:text-gray-100">Terms of use</a>
                        <span class="mx-2">|</span>
                        <a href="#" class="hover:text-gray-100">Privacy policy</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // Login function
        function login() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // Signed in
                    const user = userCredential.user;
                    console.log("Login successful:", user);
                    // Redirect to landing page
                    window.location.href = "landing.html";
                })
                .catch((error) => {
                    const errorCode = error.code;
                    const errorMessage = error.message;
                    console.error("Error during login:", errorCode, errorMessage);
                    alert("Login failed: " + errorMessage);
                });
        }
    </script>
</body>
</html>
