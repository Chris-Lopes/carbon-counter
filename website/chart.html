<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Health Analytics - Carbon Emission Website</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #eef2f3; /* Softer background color */
            margin: 0;
            padding: 20px;
            font-family: 'Arial', sans-serif;
            color: #333;
        }

        h1 {
            color: #2C3E50;
            font-size: 2.5em;
            margin-bottom: 20px;
            text-align: center;
        }

        h3 {
            color: #34495E;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
            font-size: 1.5em; /* Increased font size for better visibility */
        }

        .chart-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            max-width:65%;
           
            margin-top: 20px;
        }

        .chart {
            flex: 0 0 calc(33% - 20px); /* Make each chart take up 1/3 of the container width */
            max-width: 300px; /* Optional: maximum width for each chart */
            background-color: transparent; /* Transparent background for seamless blend */
            border-radius: 10px; /* Rounded corners */
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); /* Optional: shadow for depth */
        }

        canvas {
            width: 100%; /* Ensures canvas takes full width */
            height: auto;
        }

        /* Media Queries for responsiveness */
        @media (max-width: 768px) {
            .chart {
                flex: 0 0 calc(50% - 20px); /* 2 charts per row on medium screens */
            }
        }

        @media (max-width: 480px) {
            .chart {
                flex: 0 0 100%; /* 1 chart per row on small screens */
            }
        }
    </style>
</head>
<body>

    <h1>Public Health Analytics</h1>

    <div class="chart-container">
        <!-- Bar Chart -->
        <div class="chart">
            <h3>Health Conditions Related to Air Quality</h3>
            <canvas id="barChart" height="200"></canvas>
        </div>
        <!-- Pie Chart -->
        <div class="chart">
            <h3>Health Issues Breakdown</h3>
            <canvas id="pieChart" height="200"></canvas>
        </div>
        <!-- Doughnut Chart -->
        <div class="chart">
            <h3>Emission Sources Comparison</h3>
            <canvas id="doughnutChart" height="200"></canvas>
        </div>
        <!-- Line Chart -->
        <div class="chart">
            <h3>CO2 Emission Trends</h3>
            <canvas id="lineChart" height="200"></canvas>
        </div>
        <!-- Radar Chart -->
        <div class="chart">
            <h3>Health Issues Severity</h3>
            <canvas id="radarChart" height="200"></canvas>
        </div>
        <!-- Bar Chart for Population vs CO2 Emissions -->
        <div class="chart" style="flex: 0 0 calc(100% - 20px);"> <!-- Full width for the bar chart -->
            <h3>Population vs CO2 Emissions</h3>
            <canvas id="barPopulationCO2Chart" height="200"></canvas>
        </div>
    </div>

    <script>
        // 2D Bar Chart
        const barCtx = document.getElementById('barChart').getContext('2d');
        new Chart(barCtx, {
            type: 'bar',
            data: {
                labels: ['Asthma', 'Bronchitis', 'Heart Disease', 'Stroke', 'Lung Cancer'],
                datasets: [{
                    label: 'Number of Cases (in thousands)',
                    data: [50, 30, 20, 15, 10],
                    backgroundColor: [
                        'rgba(52, 152, 219, 0.7)', 
                        'rgba(231, 76, 60, 0.7)', 
                        'rgba(241, 196, 15, 0.7)', 
                        'rgba(46, 204, 113, 0.7)', 
                        'rgba(155, 89, 182, 0.7)'
                    ],
                    borderColor: [
                        'rgba(52, 152, 219, 1)', 
                        'rgba(231, 76, 60, 1)', 
                        'rgba(241, 196, 15, 1)', 
                        'rgba(46, 204, 113, 1)', 
                        'rgba(155, 89, 182, 1)'
                    ],
                    borderWidth: 2
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: {
                            color: '#BDC3C7'
                        }
                    }
                }
            }
        });

        // 2D Pie Chart
        const pieCtx = document.getElementById('pieChart').getContext('2d');
        new Chart(pieCtx, {
            type: 'pie',
            data: {
                labels: ['Respiratory Issues', 'Cardiovascular Issues', 'Cancer', 'Other'],
                datasets: [{
                    label: 'Health Issues',
                    data: [40, 30, 20, 10],
                    backgroundColor: [
                        'rgba(46, 204, 113, 0.7)', 
                        'rgba(231, 76, 60, 0.7)', 
                        'rgba(155, 89, 182, 0.7)', 
                        'rgba(52, 152, 219, 0.7)'
                    ],
                    borderColor: [
                        'rgba(46, 204, 113, 1)', 
                        'rgba(231, 76, 60, 1)', 
                        'rgba(155, 89, 182, 1)', 
                        'rgba(52, 152, 219, 1)'
                    ],
                    borderWidth: 2
                }]
            },
            options: {
                plugins: {
                    legend: {
                        display: true,
                        position: 'right'
                    }
                }
            }
        });

        // 2D Doughnut Chart
        const doughnutCtx = document.getElementById('doughnutChart').getContext('2d');
        new Chart(doughnutCtx, {
            type: 'doughnut',
            data: {
                labels: ['Vehicle Emissions', 'Industry', 'Agriculture', 'Residential'],
                datasets: [{
                    label: 'CO2 Emissions',
                    data: [80, 90, 60, 50],
                    backgroundColor: [
                        'rgba(52, 152, 219, 0.7)', 
                        'rgba(241, 196, 15, 0.7)', 
                        'rgba(231, 76, 60, 0.7)', 
                        'rgba(46, 204, 113, 0.7)'
                    ],
                    borderColor: [
                        'rgba(52, 152, 219, 1)', 
                        'rgba(241, 196, 15, 1)', 
                        'rgba(231, 76, 60, 1)', 
                        'rgba(46, 204, 113, 1)'
                    ],
                    borderWidth: 2
                }]
            },
            options: {
                plugins: {
                    legend: {
                        display: true,
                        position: 'bottom'
                    }
                }
            }
        });

        // 2D Line Chart
        const lineCtx = document.getElementById('lineChart').getContext('2d');
        new Chart(lineCtx, {
            type: 'line',
            data: {
                labels: ['2018', '2019', '2020', '2021', '2022'],
                datasets: [{
                    label: 'CO2 Emissions (in million tons)',
                    data: [400, 420, 410, 390, 380],
                    borderColor: 'rgba(46, 204, 113, 1)',
                    backgroundColor: 'rgba(46, 204, 113, 0.2)',
                    fill: true,
                    tension: 0.4
                }, {
                    label: 'Public Health Issues (Cases per 1000)',
                    data: [300, 310, 305, 290, 280],
                    borderColor: 'rgba(231, 76, 60, 1)',
                    backgroundColor: 'rgba(231, 76, 60, 0.2)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: {
                            color: '#BDC3C7'
                        }
                    }
                }
            }
        });

        // 2D Radar Chart
        const radarCtx = document.getElementById('radarChart').getContext('2d');
        new Chart(radarCtx, {
            type: 'radar',
            data: {
                labels: ['Air Quality', 'Physical Health', 'Mental Health', 'Environmental Impact', 'Community Engagement'],
                datasets: [{
                    label: 'Health Issues Severity',
                    data: [5, 3, 4, 2, 4],
                    backgroundColor: 'rgba(52, 152, 219, 0.5)',
                    borderColor: 'rgba(52, 152, 219, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    r: {
                        beginAtZero: true
                    }
                }
            }
        });

        // 2D Bar Chart for Population vs CO2 Emissions
        const barPopulationCO2Ctx = document.getElementById('barPopulationCO2Chart').getContext('2d');
        new Chart(barPopulationCO2Ctx, {
            type: 'bar',
            data: {
                labels: ['Population (in millions)', 'CO2 Emissions (in million tons)'],
                datasets: [{
                    label: 'Values',
                    data: [10, 20, 15, 30], // Sample data: Replace with actual values
                    backgroundColor: [
                        'rgba(52, 152, 219, 0.7)', // Color for Population
                        'rgba(231, 76, 60, 0.7)'   // Color for CO2 Emissions
                    ],
                    borderColor: [
                        'rgba(52, 152, 219, 1)', // Border color for Population
                        'rgba(231, 76, 60, 1)'   // Border color for CO2 Emissions
                    ],
                    borderWidth: 2
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: {
                            color: '#BDC3C7'
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
