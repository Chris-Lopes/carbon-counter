<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup Form</title>
    <script src="https://www.gstatic.com/firebasejs/9.16.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.16.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.16.0/firebase-firestore.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-custom {
            background-image: url('/src/images/bg.jpg');
        }
        .bg-form-custom {
            background-image: url('/src/images/login1.jpg');
        }
    </style>
  </head>
  <body class="bg-custom bg-cover bg-center bg-no-repeat bg-gray-100 h-screen w-full flex items-center justify-center">
    <div class="relative w-full max-w-md">
        <div class="bg-form-custom bg-cover bg-center bg-no-repeat rounded-lg overflow-hidden shadow-lg">
            <div class="absolute inset-0 bg-black opacity-50 rounded-lg"></div>
            <div class="relative z-10 p-8">
                <form class="w-full max-w-sm mx-auto" id="signupForm">
                    <div class="mb-6 text-center">
                        <span class="text-2xl font-bold text-white">SignUp</span>
                    </div>

                    <h5 class="text-xl font-normal mb-6 text-center text-white">
                        Create your account
                    </h5>

                    <div class="mb-4">
                        <label for="email" class="block text-sm font-medium text-white">Email address</label>
                        <input type="email" id="email" class="mt-1 block w-full rounded-md border-gray-800 bg-gray-200 p-2 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50" required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="block text-sm font-medium text-white">Password</label>
                        <input type="password" id="password" class="mt-1 block w-full rounded-md border-gray-800 bg-gray-200 p-2 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50" required>
                    </div>

                    <div class="mb-4">
                        <label for="confirm-password" class="block text-sm font-medium text-white">Confirm Password</label>
                        <input type="password" id="confirm-password" class="mt-1 block w-full rounded-md border-gray-800 bg-gray-200 p-2 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50" required>
                    </div>

                    <div class="mb-6">
                        <button type="submit" class="w-full py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                            Sign Up
                        </button>
                    </div>

                    <div class="text-sm text-center">
                        <span class="text-gray-300">Already have an account?</span>
                        <a href="login.html" class="text-indigo-300 hover:text-indigo-200"> Login here</a>
                    </div>
                    <div class="mt-6 text-xs text-center text-gray-300">
                        <a href="#" class="hover:text-gray-100">Terms of use</a>
                        <span class="mx-2">|</span>
                        <a href="#" class="hover:text-gray-100">Privacy policy</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Firebase and Script -->
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyDL5W88NtO_R2wP4FenLYYJ9-yFcD5wZRw",
        authDomain: "carbon-counter-c1b68.firebaseapp.com",
        projectId: "carbon-counter-c1b68",
        storageBucket: "carbon-counter-c1b68.appspot.com",
        messagingSenderId: "947617203336",
        appId: "1:947617203336:web:3290201da2240992e98b3d",
      };

      const app = firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();
      const db = firebase.firestore();

      document
        .getElementById("signupForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault(); 

          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;
          const confirmPassword = document.getElementById("confirm-password").value;

          if (password !== confirmPassword) {
            alert("Passwords do not match.");
            return;
          }

          try {
            const userCredential = await auth.createUserWithEmailAndPassword(
              email,
              password
            );
            const user = userCredential.user;

            await db.collection("users").doc(user.uid).set({
              email: email,
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            });

            alert("Account created and data stored successfully!");
          } catch (error) {
            console.error("Error: ", error.message);
            alert(error.message);
          }
        });
    </script>
  </body>
</html>
