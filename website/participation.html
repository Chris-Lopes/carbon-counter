<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carbon Emission Leaderboard</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e8f5e9;
            color: #2e7d32;
        }
        .container {
            max-width: 800px;
            margin: 50px auto 0;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            animation: fadeIn 1s ease;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #388e3c;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            animation: slideIn 1s ease;
        }
        th, td {
            padding: 12px;
            border: 1px solid #c8e6c9;
            text-align: center; /* Centering all columns */
            animation: fadeInRow 0.3s ease forwards;
        }
        th {
            background-color: #a5d6a7;
            color: #2e7d32;
        }
        td.text-right {
            text-align: right;
        }
        tr:nth-child(even) {
            background-color: #f1f8e9;
        }
        tr:nth-child(odd) {
            background-color: #e8f5e9;
        }

        /* Button Box */
        .btn-home-box {
            margin-top: 30px; /* Increased margin for lowering the box */
            padding: 20px;
            background-color: #f1f8e9;
            border: 1px solid #c8e6c9;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }
        .btn-home a {
            background-color: #2e7d32;
            color: #fff;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
        }
        .btn-home a:hover {
            background-color: #388e3c;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes fadeInRow {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                transform: translateX(-100%);
            }
            to {
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Carbon Emission Leaderboard</h1>

    <table>
        <thead>
            <tr>
                <th style="width: 100px;">Rank</th>
                <th>Name</th>
                <th style="width: 150px;" class="text-right">Carbon Score</th>
            </tr>
        </thead>
        <tbody id="leaderboard-body">
            <!-- Leaderboard data will be dynamically inserted here -->
        </tbody>
    </table>

    <div class="btn-home-box">
        <div class="btn-home">
            <a href="landing.html">Back to Home</a> <!-- Back to Home button -->
        </div>
    </div>
</div>

<script>
    const leaderboardData = [
        { name: "Reniyas Nadar", score: 42.5 },
        { name: "Chris Lopes", score: 55.2 },
        { name: "Harsh Dalvi", score: 61.8 },
        { name: "Vijay Nunes", score: 48.3 },
        { name: "Vashni Nadar", score: 72.1 },
        { name: "Morris D'Silva", score: 39.7 },
        { name: "Crossley Rosario", score: 58.9 },
        { name: "Vanil D'Mello", score: 52.4 },
        { name: "Hruday Patil", score: 45.6 },
        { name: "Rohan Benegal", score: 67.2 },
    ];

    const leaderboardBody = document.getElementById('leaderboard-body');

    // Sort leaderboard data by carbon score
    leaderboardData.sort((a, b) => a.score - b.score);

    // Populate table with sorted data
    leaderboardData.forEach((user, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${index + 1}</td>
            <td>${user.name}</td>
            <td class="text-right">${user.score.toFixed(1)}</td>
        `;
        leaderboardBody.appendChild(row);
    });
</script>

</body>
</html>
